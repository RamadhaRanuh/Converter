name: converter release

# Push a tag like v0.1.0 to build the Windows downloads and attach them to a draft GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: converter
    steps:
      - uses: actions/checkout@v4

      - name: Rust toolchain
        run: rustup update stable && rustup default stable

      - name: libheif (vcpkg, no GPL x265)
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "libheif[core]:x64-windows"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT\installed\x64-windows\bin" >> $env:GITHUB_PATH

      - name: Test
        env:
          VCPKGRS_DYNAMIC: "1"
        run: cargo test --workspace --features converter-core/heic

      - name: cargo-packager
        run: cargo install cargo-packager --locked

      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $files = Get-ChildItem dist -File | Where-Object { $_.Name -match '\.(zip|exe)$' } | ForEach-Object FullName
          gh release create "${{ github.ref_name }}" --draft --title "Converter ${{ github.ref_name }}" --notes-file RELEASE_NOTES.md @files
