[package]
name = "converter-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
comrak = "0.55.0"
fast_image_resize = { version = "6.1.0", features = ["rayon", "image"] }
flate2 = "1.1.10"
hayro = "0.7.1"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "bmp", "tiff", "gif", "webp", "rayon"] }
lopdf = "0.45.0"
office2pdf = "0.7.0"
oxvg_ast = { version = "0.0.8", features = ["roxmltree"] }
oxvg_optimiser = "0.0.8"
rayon = "1.12.0"
resvg = "0.48.1"
svg2pdf = "0.13.0"
thiserror = "2.0.21"
vtracer = "0.6.5"
webp = "0.3.1"
zune-core = "0.5.3"
zune-psd = "0.5.1"

[dev-dependencies]
docx-rs = "=0.4.22"
tempfile = "3.27.0"
