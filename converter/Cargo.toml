[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Rama Ranuh <ramadha.ranuh@gmail.com>"]
repository = "https://github.com/RamadhaRanuh/Converter"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"

# Codecs are painfully slow unoptimized; keep tests usable.
[profile.dev.package."*"]
opt-level = 3

[profile.test.package."*"]
opt-level = 3
